<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VJ · Preview</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <canvas id="bg"></canvas>
    <div id="fg-container"></div>

    <div class="ui" id="ui-preview">
      <h1>VJ · Preview</h1>

      <div class="mode-selector" id="mode-selector">
        <button data-mode="sandbox"   class="active">Sandbox</button>
        <button data-mode="inspector">Inspector</button>
        <button data-mode="cue">Cue</button>
      </div>

      <div class="row">
        <button id="btn-start">Start Audio</button>
        <select id="device-pick" disabled><option>—</option></select>
      </div>

      <div class="row">
        <button id="btn-bg" class="on">Background</button>
        <button id="btn-fg" class="on">Foreground</button>
        <button id="btn-prev">◀ Prev</button>
        <button id="btn-next">Next ▶</button>
      </div>

      <div class="meter"><div id="level-bar"></div></div>
      <div class="status" id="status">click Start Audio to grant mic permission</div>
      <div class="status" id="preset-name" style="color:#0ff;"></div>
      <div class="status" id="ws-status" style="color:#666;"></div>
      <div class="status" id="mode-info" style="color:#ff3d7f;">mode: sandbox — independent audio + modules</div>

      <div class="modules-list" id="modules-list"></div>

      <div class="row" id="cue-controls" style="display:none;">
        <button id="btn-promote">Promote to Main →</button>
      </div>
    </div>

    <script type="module" src="/src/preview.js"></script>
  </body>
</html>
