<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VJ · Bench</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #0a0a12; color: #cfd3e8; font: 13px/1.35 ui-monospace, Menlo, monospace; height: 100%; overflow: hidden; }
      main { display: grid; grid-template-rows: auto auto auto 1fr; gap: 8px; padding: 10px; height: 100%; }
      section { background: #11111f; border: 1px solid #1e1e33; border-radius: 8px; padding: 8px 10px; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: nowrap; }
      .title { color: #667; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
      .big { font-size: 34px; font-weight: 700; color: #fff; min-width: 110px; }
      .unit { font-size: 12px; color: #667; }
      button { background: #23233a; color: #dde; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
      button.on { background: #17b26a; color: #fff; }
      input[type=range] { width: 110px; }
      canvas { display: block; background: #0c0c16; border-radius: 4px; }
      .lbl { color: #667; font-size: 11px; }
      #log { overflow-y: auto; height: 100%; font-size: 12px; white-space: pre-wrap; }
      #log .t { color: #556; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #23233a; display: inline-block; margin-right: 4px; }
      .dot.on { background: #ffd24d; }
      .kv { color: #8fa; }
      #tapHint { color: #556; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="title">Beat instrument — judge by ear</div>
        <div class="row">
          <div><span class="big" id="bpm">—</span> <span class="unit">BPM</span></div>
          <canvas id="conf" width="90" height="46"></canvas>
          <div id="barDots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <button id="click-toggle">Click track: OFF</button>
          <label class="lbl">vol <input type="range" id="click-vol" min="0" max="1" step="0.05" value="0.5"></label>
          <span id="tapHint">SPACE = tap along · median offset <span class="kv" id="tapMed">—</span></span>
          <canvas id="bpmSpark" width="360" height="46"></canvas>
        </div>
        <div class="row" style="margin-top:6px;">
          <span class="lbl" style="width:110px;">onsets vs grid<br>(±0.5 beat, 30 s)</span>
          <canvas id="onsetStrip" width="1060" height="84"></canvas>
        </div>
      </section>

      <section>
        <div class="title">Audio</div>
        <div class="row">
          <canvas id="bandBars" width="260" height="64"></canvas>
          <canvas id="rms" width="30" height="64"></canvas>
          <canvas id="fluxSpark" width="330" height="64"></canvas>
          <canvas id="centroid" width="30" height="64"></canvas>
          <canvas id="zSpark" width="430" height="64"></canvas>
        </div>
      </section>

      <section>
        <div class="title">Creature</div>
        <div class="row">
          <div style="min-width:200px;">
            <div>state <span class="kv" id="cState">—</span></div>
            <div>move <span class="kv" id="cMove">—</span></div>
            <div>blend <span class="kv" id="cBlend">—</span> · spikes <span class="kv" id="cSpikes">0</span></div>
          </div>
          <canvas id="phaseWheel" width="72" height="72"></canvas>
          <canvas id="ribbon" width="640" height="64"></canvas>
          <canvas id="speedSpark" width="330" height="64"></canvas>
        </div>
      </section>

      <section style="min-height:0;">
        <div class="title">Decision log</div>
        <div id="log"></div>
      </section>
    </main>
    <script type="module" src="/src/bench.js"></script>
  </body>
</html>
