<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DJ Controller</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #ccc;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 32px;
    }

    header {
      text-align: center;
    }
    header h1 {
      font-size: 1.1rem;
      letter-spacing: 0.4em;
      color: #0ff;
      text-transform: uppercase;
    }
    header p {
      margin-top: 6px;
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 0.2em;
    }

    /* ── steps ─────────────────────────────────────── */
    .step { display: none; width: 100%; max-width: 640px; flex-direction: column; gap: 20px; }
    .step.active { display: flex; }

    .step-title {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: #555;
      text-transform: uppercase;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 10px;
    }

    /* ── file list ──────────────────────────────────── */
    #file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-item {
      padding: 14px 18px;
      border: 1px solid #222;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #aaa;
      transition: all 0.1s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .file-item:hover { border-color: #0ff4; color: #fff; background: #111; }
    .file-item::before { content: "♫"; color: #0ff5; font-size: 1rem; }

    .empty { color: #444; font-size: 0.8rem; padding: 20px 0; text-align: center; }

    /* ── metadata ───────────────────────────────────── */
    #meta-view {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    #cover-art {
      width: 140px;
      height: 140px;
      border-radius: 6px;
      background: #151515;
      border: 1px solid #222;
      object-fit: cover;
      flex-shrink: 0;
    }
    #cover-placeholder {
      width: 140px;
      height: 140px;
      border-radius: 6px;
      background: #111;
      border: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      flex-shrink: 0;
      color: #222;
    }
    .meta-info { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .meta-title { font-size: 1.1rem; color: #fff; font-weight: bold; }
    .meta-artist { font-size: 0.9rem; color: #0ff; }
    .meta-detail { font-size: 0.75rem; color: #555; }
    .meta-duration { font-size: 0.8rem; color: #888; margin-top: 4px; }

    /* ── prompt ─────────────────────────────────────── */
    label { font-size: 0.7rem; letter-spacing: 0.2em; color: #555; text-transform: uppercase; }

    textarea {
      width: 100%;
      min-height: 90px;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      color: #ddd;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 12px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: #0ff4; }

    /* ── buttons ─────────────────────────────────────── */
    .btn {
      padding: 12px 28px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: all 0.12s;
    }
    .btn-primary { background: #0ff2; color: #0ff; border: 1px solid #0ff4; }
    .btn-primary:hover { background: #0ff3; border-color: #0ff; }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: #555; border: 1px solid #222; }
    .btn-ghost:hover { color: #aaa; border-color: #444; }

    .row { display: flex; gap: 12px; align-items: center; }

    /* ── spinner ─────────────────────────────────────── */
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px 0;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid #1a1a1a;
      border-top-color: #0ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-label { font-size: 0.75rem; color: #555; letter-spacing: 0.2em; }

    /* ── DJ pads ─────────────────────────────────────── */
    .success-msg {
      text-align: center;
      font-size: 0.75rem;
      color: #0f0;
      letter-spacing: 0.2em;
    }
    .pads {
      display: flex;
      gap: 24px;
      justify-content: center;
    }
    .pad-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .pad {
      width: 130px; height: 130px;
      border-radius: 50%;
      border: 3px solid #222;
      background: #111;
      color: #555;
      font-family: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.1s;
      outline: none;
    }
    .pad:hover { border-color: #444; color: #aaa; }
    .pad.active {
      background: #001a00;
      border-color: #0f0;
      color: #0f0;
      box-shadow: 0 0 28px #0f06, inset 0 0 18px #0f02;
    }
    .pad-label { font-size: 0.65rem; color: #333; letter-spacing: 0.2em; text-transform: uppercase; }
    .pad-label.active { color: #0f0; }

    /* ── params ──────────────────────────────────────── */
    .params {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .param-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .param-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .param-name {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: #555;
      text-transform: uppercase;
    }
    .param-val {
      font-size: 0.75rem;
      color: #0ff;
      min-width: 36px;
      text-align: right;
    }
    .param-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 2px;
      background: #222;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .param-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0ff;
      cursor: pointer;
      transition: background 0.1s;
    }
    .param-slider:hover::-webkit-slider-thumb { background: #fff; }

    .link-btn {
      background: none; border: none; color: #555; font-family: inherit;
      font-size: 0.7rem; letter-spacing: 0.15em; cursor: pointer; text-decoration: underline;
    }
    .link-btn:hover { color: #aaa; }

    /* ── sessions ───────────────────────────────────── */
    .sessions-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .session-item {
      padding: 12px 16px;
      border: 1px solid #1e1e1e;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.1s;
    }
    .session-item:hover { border-color: #0ff4; background: #111; }
    .session-desc { font-size: 0.85rem; color: #bbb; }
    .session-meta { font-size: 0.7rem; color: #444; }
  </style>
</head>
<body>
  <header>
    <h1>DJ Controller</h1>
    <p id="header-sub">select a track to begin</p>
  </header>

  <!-- Step 1: File picker -->
  <div class="step active" id="step-files">
    <div class="step-title">Music Library</div>
    <div style="margin-bottom:4px">
      <button class="btn btn-primary" onclick="selectLiveInput()" style="width:100%">⬤ Live Input (BlackHole)</button>
    </div>
    <div id="file-list"><div class="empty">Loading...</div></div>

    <div class="sessions-section" id="sessions-section" style="display:none">
      <div class="step-title" style="margin-top:8px">Previous Sessions</div>
      <div id="session-list"></div>
    </div>
  </div>

  <!-- Step 2: Metadata + prompt -->
  <div class="step" id="step-meta">
    <div class="step-title" id="meta-step-title">Track Info</div>
    <div id="meta-view">
      <div id="cover-placeholder">♫</div>
      <div class="meta-info">
        <div class="meta-title" id="meta-title">—</div>
        <div class="meta-artist" id="meta-artist">—</div>
        <div class="meta-detail" id="meta-album"></div>
        <div class="meta-detail" id="meta-year-genre"></div>
        <div class="meta-duration" id="meta-duration"></div>
      </div>
    </div>
    <label for="prompt-input">Describe the visuals</label>
    <textarea id="prompt-input" placeholder="e.g. pulsing neon grid that reacts to bass, psychedelic tunnel, particle explosion..."></textarea>

    <div style="display:flex; flex-direction:column; gap:8px;">
      <label for="image-input">Source image (optional — drives palette, contours &amp; blobs)</label>
      <div style="display:flex; align-items:center; gap:12px;">
        <label class="btn btn-ghost" style="cursor:pointer; padding:10px 18px;">
          Choose image
          <input type="file" id="image-input" accept="image/*" style="display:none" onchange="onImageSelect(this)">
        </label>
        <span id="image-label" style="font-size:0.75rem; color:#555;">no file selected</span>
        <button id="image-clear" class="link-btn" style="display:none" onclick="clearImage()">clear</button>
      </div>
      <canvas id="image-preview" width="200" height="120"
        style="display:none; border:1px solid #222; border-radius:4px; object-fit:contain; background:#111;"></canvas>
    </div>

    <div class="row">
      <button class="btn btn-primary" id="generate-btn" onclick="generate()">Generate Sketch</button>
      <button class="btn btn-ghost" onclick="goTo('step-files')">← Back</button>
    </div>
  </div>

  <!-- Step 3: Generating -->
  <div class="step" id="step-generating">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div class="spinner-label">Generating sketch with AI...</div>
    </div>
  </div>

  <!-- Step 4: Controller -->
  <div class="step" id="step-controller">
    <div class="step-title">Now Playing</div>
    <div class="success-msg" id="success-msg"></div>
    <div class="params" id="params"></div>
    <div class="pads" id="pads"></div>

    <div style="border-top:1px solid #1a1a1a; padding-top:20px; display:flex; flex-direction:column; gap:12px;">
      <label for="refine-input">Modify the sketch</label>
      <textarea id="refine-input" style="min-height:70px" placeholder="e.g. make it black and white, add more particles, make the beat reaction stronger..."></textarea>
      <div class="row">
        <button class="btn btn-primary" id="refine-btn" onclick="refine()">Refine Sketch</button>
      </div>
    </div>

    <div style="text-align:center">
      <button class="link-btn" onclick="goTo('step-files')">← New sketch</button>
    </div>
  </div>

  <script>
    let selectedFile = null;
    let currentSessionId = null;
    let liveInput = false;
    let selectedImage = null;

    // ── navigation ─────────────────────────────────────────
    function goTo(stepId) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById(stepId).classList.add('active');
    }

    // ── file list ──────────────────────────────────────────
    async function loadFiles() {
      const res = await fetch('/music');
      const files = await res.json();
      const list = document.getElementById('file-list');
      if (!files.length) {
        list.innerHTML = '<div class="empty">No MP3 files found in music folder.</div>';
        return;
      }
      list.innerHTML = files.map(f =>
        `<div class="file-item" onclick='selectFile(${JSON.stringify(f)})'>${f}</div>`
      ).join('');
    }

    // ── live input ─────────────────────────────────────────
    function selectLiveInput() {
      liveInput = true;
      selectedFile = null;
      clearImage();
      document.getElementById('header-sub').textContent = 'live input';
      document.getElementById('meta-step-title').textContent = 'Live Input';
      document.getElementById('meta-view').style.display = 'none';
      document.getElementById('prompt-input').placeholder =
        'e.g. pulsing plasma that reacts to bass, geometric tunnel, particle storm...';
      goTo('step-meta');
    }

    // ── select track ───────────────────────────────────────
    async function selectFile(filename) {
      liveInput = false;
      selectedFile = filename;
      document.getElementById('header-sub').textContent = filename;
      document.getElementById('meta-step-title').textContent = 'Track Info';
      document.getElementById('meta-view').style.display = 'flex';
      goTo('step-meta');

      // reset metadata
      document.getElementById('meta-title').textContent = filename.replace(/\.mp3$/i, '');
      document.getElementById('meta-artist').textContent = '';
      document.getElementById('meta-album').textContent = '';
      document.getElementById('meta-year-genre').textContent = '';
      document.getElementById('meta-duration').textContent = '';
      const placeholder = document.getElementById('cover-placeholder');
      const existingImg = document.getElementById('cover-art');
      if (existingImg) existingImg.remove();
      placeholder.style.display = 'flex';

      try {
        const res = await fetch(`/music/metadata?file=${encodeURIComponent(filename)}`);
        const meta = await res.json();

        if (meta.title) document.getElementById('meta-title').textContent = meta.title;
        if (meta.artist) document.getElementById('meta-artist').textContent = meta.artist;
        if (meta.album) document.getElementById('meta-album').textContent = meta.album;

        const details = [meta.year, meta.genre].filter(Boolean).join(' · ');
        document.getElementById('meta-year-genre').textContent = details;

        if (meta.duration) {
          const m = Math.floor(meta.duration / 60);
          const s = String(Math.floor(meta.duration % 60)).padStart(2, '0');
          document.getElementById('meta-duration').textContent = `${m}:${s}`;
        }

        if (meta.cover) {
          placeholder.style.display = 'none';
          const img = document.createElement('img');
          img.id = 'cover-art';
          img.src = meta.cover;
          img.alt = 'cover';
          placeholder.parentNode.insertBefore(img, placeholder);
        }
      } catch (_) {}
    }

    // ── image picker ───────────────────────────────────────
    function onImageSelect(input) {
      const file = input.files[0];
      if (!file) return;
      selectedImage = file;
      document.getElementById('image-label').textContent = file.name;
      document.getElementById('image-clear').style.display = 'inline';
      const canvas = document.getElementById('image-preview');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        canvas.style.display = 'block';
        const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
        const w = img.width * scale, h = img.height * scale;
        const x = (canvas.width - w) / 2, y = (canvas.height - h) / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, x, y, w, h);
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    }

    function clearImage() {
      selectedImage = null;
      document.getElementById('image-input').value = '';
      document.getElementById('image-label').textContent = 'no file selected';
      document.getElementById('image-clear').style.display = 'none';
      const canvas = document.getElementById('image-preview');
      canvas.style.display = 'none';
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }

    // ── generate ───────────────────────────────────────────
    async function generate() {
      const description = document.getElementById('prompt-input').value.trim();
      if (!description) {
        document.getElementById('prompt-input').focus();
        return;
      }
      goTo('step-generating');

      try {
        const form = new FormData();
        form.append('description', description);
        if (selectedFile) form.append('mp3File', selectedFile);
        if (liveInput) form.append('liveInput', '1');
        if (selectedImage) form.append('image', selectedImage);

        const res = await fetch('/generate', { method: 'POST', body: form });
        const data = await res.json();

        if (data.sessionId) {
          currentSessionId = data.sessionId;
          const trackName = liveInput ? 'live input' : (selectedFile ? selectedFile.replace(/\.mp3$/i, '') : null);
          document.getElementById('success-msg').textContent =
            trackName ? `Sketch launched · ${trackName}` : 'Sketch launched';
          renderParams(data.params);
          renderEffects(data.effects);
          goTo('step-controller');
        } else {
          alert('Generation failed: ' + (data.error ?? 'unknown error'));
          goTo('step-meta');
        }
      } catch (err) {
        alert('Network error: ' + err);
        goTo('step-meta');
      }
    }

    // ── refine ─────────────────────────────────────────────
    async function refine() {
      const modification = document.getElementById('refine-input').value.trim();
      if (!modification || !currentSessionId) return;
      const btn = document.getElementById('refine-btn');
      btn.disabled = true;
      btn.textContent = 'Refining...';
      try {
        const res = await fetch('/refine', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: currentSessionId, modification }),
        });
        const data = await res.json();
        if (data.sessionId) {
          currentSessionId = data.sessionId;
          document.getElementById('refine-input').value = '';
          document.getElementById('success-msg').textContent = 'Sketch refined and relaunched';
          renderParams(data.params);
          renderEffects(data.effects);
        } else {
          alert('Refine failed: ' + (data.error ?? 'unknown error'));
        }
      } catch (err) {
        alert('Network error: ' + err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Refine Sketch';
      }
    }

    // ── effects ────────────────────────────────────────────
    function camelLabel(name) {
      return name.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase()).trim();
    }

    function renderEffects(effects) {
      const pads = document.getElementById('pads');
      if (!effects || !effects.length) { pads.innerHTML = ''; return; }
      pads.innerHTML = effects.map(name => `
        <div class="pad-wrap">
          <button class="pad" id="${name}" onclick="toggle('${name}')">${camelLabel(name)}</button>
          <span class="pad-label" id="label-${name}">off</span>
        </div>`).join('');
    }

    // ── params ─────────────────────────────────────────────
    let paramDebounce = {};

    function renderParams(params) {
      const container = document.getElementById('params');
      const entries = Object.entries(params ?? {});
      if (!entries.length) { container.innerHTML = ''; return; }
      container.innerHTML = entries.map(([name, val]) => {
        const pct = Math.round(val * 100);
        return `
        <div class="param-wrap">
          <div class="param-header">
            <span class="param-name">${camelLabel(name)}</span>
            <span class="param-val" id="val-${name}">${pct}%</span>
          </div>
          <input type="range" class="param-slider" id="slider-${name}"
            min="0" max="100" value="${pct}"
            oninput="onSlider('${name}', this.value)">
        </div>`;
      }).join('');
    }

    async function onSlider(name, rawVal) {
      document.getElementById(`val-${name}`).textContent = rawVal + '%';
      clearTimeout(paramDebounce[name]);
      paramDebounce[name] = setTimeout(async () => {
        await fetch(`/param/${name}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: rawVal / 100 }),
        });
      }, 40);
    }

    // ── DJ toggles ─────────────────────────────────────────
    async function toggle(name) {
      const res = await fetch(`/toggle/${name}`, { method: 'POST' });
      updatePads(await res.json());
    }

    async function pollState() {
      try {
        const res = await fetch('/state');
        updatePads(await res.json());
      } catch (_) {}
    }

    function updatePads(state) {
      for (const [key, val] of Object.entries(state)) {
        const pad = document.getElementById(key);
        const lbl = document.getElementById(`label-${key}`);
        if (pad) pad.classList.toggle('active', val);
        if (lbl) { lbl.textContent = val ? 'on' : 'off'; lbl.classList.toggle('active', val); }
      }
    }

    // ── sessions ───────────────────────────────────────────
    async function loadPreviousSessions() {
      try {
        const res = await fetch('/sessions');
        const sessions = await res.json();
        if (!sessions.length) return;

        const section = document.getElementById('sessions-section');
        const list = document.getElementById('session-list');
        list.innerHTML = sessions.map(s => {
          const mp3Label = s.mp3Path ? `<span class="session-meta">${s.mp3Path.split('/').pop()}</span>` : '';
          const effectsLabel = s.effects?.length ? `<span class="session-meta">${s.effects.join(', ')}</span>` : '';
          return `<div class="session-item" onclick='restoreSession(${JSON.stringify(s.sessionId)}, ${JSON.stringify(s.description)}, ${JSON.stringify(s.mp3Path)}, ${JSON.stringify(s.effects ?? [])}, ${JSON.stringify(s.params ?? {})})'>
            <span class="session-desc">${s.description}</span>
            ${mp3Label}${effectsLabel}
          </div>`;
        }).join('');
        section.style.display = 'flex';
      } catch (_) {}
    }

    async function restoreSession(sessionId, description, mp3Path, effects, params) {
      currentSessionId = sessionId;
      const trackName = mp3Path ? mp3Path.split('/').pop().replace(/\.mp3$/i, '') : null;
      document.getElementById('header-sub').textContent = trackName ?? description;
      goTo('step-generating');
      try {
        const res = await fetch('/relaunch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId }),
        });
        const data = await res.json();
        document.getElementById('success-msg').textContent =
          trackName ? `Session restored · ${trackName}` : 'Session restored';
        renderParams(data.params ?? params);
        renderEffects(data.effects ?? effects);
        goTo('step-controller');
      } catch (err) {
        alert('Relaunch error: ' + err);
        goTo('step-files');
      }
    }

    setInterval(pollState, 400);
    loadFiles();
    loadPreviousSessions();
  </script>
</body>
</html>
